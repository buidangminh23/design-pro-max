<!doctype html>
<!-- Fail fixture for LP-AMB-01: the marquee animation is plain CSS and its Pause button is wired by script, so with
     script it pauses and under reduced motion it stops, but without script it scrolls for ever and Pause does nothing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP-AMB-01 fail: marquee without script</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  body { margin: 0; padding: var(--space-6) var(--page-gutter); font-family: var(--font-sans); font-size: var(--type-body-size); line-height: var(--type-body-leading); color: var(--color-ink); background: var(--color-bg); }
  h2 { margin: 0 0 var(--heading-after); font-size: var(--type-title-size); line-height: var(--type-title-leading); }
  .marquee { overflow: hidden; }
  .track { display: flex; gap: var(--space-6); width: max-content; list-style: none; padding: 0; margin: 0; animation: slide 20s linear infinite; }
  .marquee[data-paused] .track { animation-play-state: paused; }
  @keyframes slide { to { translate: -50% 0; } }
  @media (prefers-reduced-motion: reduce) { .track { animation: none; } }
</style>
</head>
<body>
<section class="marquee" data-marquee aria-label="customer logos">
  <h2>Names that scroll without script</h2>
  <ul class="track" id="track">
    <li>Orchard Labs</li><li>Northfield</li><li>Kite and Co</li><li>Lumen Works</li>
    <li aria-hidden="true">Orchard Labs</li><li aria-hidden="true">Northfield</li><li aria-hidden="true">Kite and Co</li><li aria-hidden="true">Lumen Works</li>
  </ul>
  <button type="button" data-marquee-toggle aria-controls="track">Pause</button>
</section>
<script type="module">
  const marquee = document.querySelector('[data-marquee]');
  const toggle = marquee.querySelector('[data-marquee-toggle]');
  toggle.addEventListener('click', () => {
    const paused = marquee.toggleAttribute('data-paused');
    toggle.textContent = paused ? 'Play' : 'Pause';
  });
</script>
</body>
</html>
