<!doctype html>
<!-- Fail fixture for LV-EMBED-02: a lazy loop that respects reduced motion and starts playing 1.5 s after it comes into
     view, with a labelled Pause button whose handler only changes its label, so the clip keeps moving. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop with a dead pause button</title>
<style>
  body { margin: 0; font: 17px/1.5 system-ui, sans-serif; }
  .intro { min-height: 200vh; }
  figure { width: 400px; margin: 0 auto 100vh; }
  video { width: 100%; height: auto; display: block; }
  button { min-height: 44px; }
</style>
</head>
<body>
<section class="intro"><p>Scroll down.</p></section>
<figure>
  <video muted loop playsinline preload="none" width="640" height="360">
    <source data-src="loop.mp4" type="video/mp4">
  </video>
  <button type="button">Pause</button>
</figure>
<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const video = document.querySelector('video');
  const button = document.querySelector('button');
  button.addEventListener('click', () => {
    button.textContent = button.textContent === 'Pause' ? 'Play' : 'Pause';
  });
  const attach = () => {
    if (video.dataset.loaded) return;
    video.dataset.loaded = '1';
    for (const source of video.querySelectorAll('source')) source.src = source.dataset.src;
    video.load();
  };
  new IntersectionObserver(([entry]) => {
    if (entry.isIntersecting && !reduce) attach();
  }, { rootMargin: '600px' }).observe(video);
  let timer = 0;
  new IntersectionObserver(([entry]) => {
    clearTimeout(timer);
    if (reduce) return;
    if (entry.intersectionRatio < 0.5) return video.pause();
    attach();
    timer = setTimeout(() => video.play().catch(() => {}), 1500);
  }, { threshold: [0, 0.5, 1] }).observe(video);
</script>
</body>
</html>
