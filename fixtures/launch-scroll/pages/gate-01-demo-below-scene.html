<!doctype html>
<!-- Pass fixture for LS-GATE-01: the reference image sequence with a lazy demo clip below the scene, as on a launch
     page that combines launch-page, launch-video and launch-scroll. The clip loads when near under every gate, which is
     right for a demo clip; only the scene's own media count as scrub film. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LS-GATE-01 demo clip below a scene</title>
<link rel="stylesheet" href="../lib/scene.css">
<style>
  body { margin: 0; font: 17px/1.5 system-ui, sans-serif; color: #15171a; background: #ffffff; }
  .intro, .outro { min-height: 90vh; display: grid; place-items: center; padding: 0 24px; text-align: center; }
  [data-scene] { --scene-travel: 200vh; --film-ratio: 16 / 9; --film-width: 880px; }
  .stage { width: min(100% - 48px, 880px); display: grid; gap: 24px; }
  .stage h2 { margin: 0; font-size: 32px; line-height: 40px; }
  .demo { width: min(100% - 48px, 640px); height: auto; }
</style>
</head>
<body>
<section class="intro"><p>Scroll down. The sequence follows the scroll position, one image per step.</p></section>

<section data-scene aria-labelledby="sequence-title">
  <div data-scene-sticky>
    <div class="stage" data-scene-stage>
      <h2 id="sequence-title">The sequence follows your scroll</h2>
      <div data-scene-film role="img" aria-label="Describe what the sequence shows, for screen readers">
        <img data-scene-still src="sequence/still.jpg" width="1280" height="720" alt="" loading="lazy" decoding="async">
        <img data-scene-startframe src="sequence/startframe.jpg" width="1280" height="720" alt="" decoding="async">
        <canvas data-sequence data-src="sequence/sequence.json" aria-hidden="true"></canvas>
      </div>
    </div>
  </div>
</section>

<section class="outro">
  <p>A demo clip outside the scene, loaded when it comes near whatever the scroll scene decided.</p>
  <video class="demo" muted playsinline preload="none" width="640" height="360" aria-label="Demo clip"><source data-src="demo.mp4" type="video/mp4"></video>
</section>

<script type="module">
  import { mountSequenceScene } from '../lib/frame-window.js';
  mountSequenceScene(document.querySelector('[data-scene]'), { radius: 8 });
  const demo = document.querySelector('video.demo');
  new IntersectionObserver((entries, observer) => {
    if (!entries.some((entry) => entry.isIntersecting)) return;
    observer.disconnect();
    for (const source of demo.querySelectorAll('source[data-src]')) source.src = source.dataset.src;
    demo.preload = 'metadata';
    demo.load();
  }, { rootMargin: '100% 0px' }).observe(demo);
</script>
</body>
</html>
