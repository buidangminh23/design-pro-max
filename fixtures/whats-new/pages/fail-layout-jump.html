<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whats-new fixture: card height jumps</title>
<link rel="stylesheet" href="../lib/whats-new.css">
<style>body { margin: 0; min-height: 100dvh; font-family: system-ui, sans-serif; background: #f2f2f5; } main { padding: 32px; }
.wn .wn-page:not([data-current]) { display: none; }
.wn .wn-page:nth-child(2) .wn-media { aspect-ratio: 4 / 3; }</style>
</head>
<body>
<main><h1>Fixture app</h1><button type="button" id="show">What's New…</button></main>
<script type="module">
import { feature, run } from './fixture.js';
run(() => [
  feature(0, undefined, 'Short.'),
  feature(1, undefined, 'A much longer description that wraps over several lines of the card so the page is taller than the first one, which a card that sizes to the current page shows as a jump.'),
  feature(2),
]);
</script>
</body>
</html>
