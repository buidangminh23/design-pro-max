<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whats-new fixture: marks the version seen when it opens</title>
<link rel="stylesheet" href="../lib/whats-new.css">
<style>body { margin: 0; min-height: 100dvh; font-family: system-ui, sans-serif; background: #f2f2f5; } main { padding: 32px; }</style>
</head>
<body>
<main><h1>Fixture app</h1><button type="button" id="show">What's New…</button></main>
<script type="module">
import { markWhatsNewSeen, showWhatsNew, whatsNewDecision } from '../lib/whats-new.js';
import { VERSION, artFeatures } from './fixture.js';
const decision = whatsNewDecision(localStorage.getItem('whats-new:last-seen'), VERSION);
markWhatsNewSeen({ version: VERSION });
if (decision === 'update') showWhatsNew({ version: VERSION, features: artFeatures(1), force: true });
</script>
</body>
</html>
