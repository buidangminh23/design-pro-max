<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whats-new fixture: video with sound and no poster</title>
<link rel="stylesheet" href="../lib/whats-new.css">
<style>body { margin: 0; min-height: 100dvh; font-family: system-ui, sans-serif; background: #f2f2f5; } main { padding: 32px; }</style>
</head>
<body>
<main><h1>Fixture app</h1><button type="button" id="show">What's New…</button></main>
<script type="module">
import { run, videoFeatures, whenOpen } from './fixture.js';
whenOpen((dialog) => {
  const video = dialog.querySelector('video');
  video.muted = false;
  video.removeAttribute('muted');
  video.removeAttribute('poster');
  video.removeAttribute('playsinline');
  video.playsInline = false;
});
run(videoFeatures);
</script>
</body>
</html>
