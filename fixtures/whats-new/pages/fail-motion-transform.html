<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whats-new fixture: pages slide under reduced motion</title>
<link rel="stylesheet" href="../lib/whats-new.css">
<style>body { margin: 0; min-height: 100dvh; font-family: system-ui, sans-serif; background: #f2f2f5; } main { padding: 32px; }
@media (prefers-reduced-motion: reduce) {
  .wn .wn-page { transition: opacity 300ms ease-out, translate 300ms ease-out, visibility 0s linear 300ms !important; }
  .wn .wn-page[data-side="before"] { translate: -24px 0 !important; }
  .wn .wn-page[data-side="after"] { translate: 24px 0 !important; }
  .wn .wn-page[data-current] { translate: none !important; transition-delay: 0s !important; }
}</style>
</head>
<body>
<main><h1>Fixture app</h1><button type="button" id="show">What's New…</button></main>
<script type="module">
import { artFeatures, run } from './fixture.js';
run(() => artFeatures(3));
</script>
</body>
</html>
