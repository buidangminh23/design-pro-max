<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whats-new fixture: marks the version seen a second after it opens</title>
<link rel="stylesheet" href="../lib/whats-new.css">
<style>body { margin: 0; min-height: 100dvh; font-family: system-ui, sans-serif; background: #f2f2f5; } main { padding: 32px; }</style>
</head>
<body>
<main><h1>Fixture app</h1><button type="button" id="show">What's New…</button></main>
<script type="module">
import { VERSION, artFeatures, run, whenOpen } from './fixture.js';
run(() => artFeatures(2));
whenOpen(() => setTimeout(() => localStorage.setItem('whats-new:last-seen', VERSION), 1000));
</script>
</body>
</html>
