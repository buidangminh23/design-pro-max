<style>body { margin: 0; min-height: 100dvh; font-family: system-ui, sans-serif; background: #f2f2f5; } main { padding: 32px; }</style>

<body>
<main><h1>Fixture app</h1><button type="button" id="show">What's New…</button></main>
<script type="module">
const seek = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'currentTime');
Object.defineProperty(HTMLMediaElement.prototype, 'currentTime', { configurable: true, get: seek.get, set() {} });
const { run, videoFeatures } = await import('./fixture.js');
run(videoFeatures);
</script>
