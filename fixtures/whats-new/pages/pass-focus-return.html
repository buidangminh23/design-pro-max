<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whats-new fixture: a search field has focus before the popup opens</title>
<link rel="stylesheet" href="../lib/whats-new.css">
<style>body { margin: 0; min-height: 100dvh; font-family: system-ui, sans-serif; background: #f2f2f5; } main { padding: 32px; }
main input { font: inherit; }</style>
</head>
<body>
<main><h1>Fixture app</h1><button type="button" id="show">What's New…</button></main>
<script type="module">
document.querySelector('main').insertAdjacentHTML('beforeend', '<input id="search" aria-label="Search">');
document.getElementById('search').focus();
const { artFeatures, run } = await import('./fixture.js');
run(() => artFeatures(2));
</script>
</body>
</html>
