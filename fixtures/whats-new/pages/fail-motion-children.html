<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whats-new fixture: page content slides in under reduced motion</title>
<link rel="stylesheet" href="../lib/whats-new.css">
<style>body { margin: 0; min-height: 100dvh; font-family: system-ui, sans-serif; background: #f2f2f5; } main { padding: 32px; }
@media (prefers-reduced-motion: reduce) {
  .wn .wn-page[data-current] .wn-body, .wn .wn-page[data-current] .wn-media { animation: fx-slide-in 400ms ease-out; }
}
@keyframes fx-slide-in { from { transform: translateX(40px); } to { transform: none; } }</style>
</head>
<body>
<main><h1>Fixture app</h1><button type="button" id="show">What's New…</button></main>
<script type="module">
import { artFeatures, run } from './fixture.js';
run(() => artFeatures(3));
</script>
</body>
</html>
