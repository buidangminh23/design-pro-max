name: Verify

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "skills/apple/shared/**"
      - "skills/apple/launch-*/**"
      - "rules.json"
      - "fixtures/**"
      - "evidence/**"
      - "scripts/verify.mjs"
      - "scripts/lib/fixture-media.mjs"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "skills/apple/shared/**"
      - "skills/apple/launch-*/**"
      - "rules.json"
      - "fixtures/**"
      - "evidence/**"
      - "scripts/verify.mjs"
      - "scripts/lib/fixture-media.mjs"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Media and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Playwright and its headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.61.0
          npx playwright install --with-deps --only-shell chromium
      - name: Every fixture judged red-first (L1 media, L3 browser)
        run: node scripts/verify.mjs
