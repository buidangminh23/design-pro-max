name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: npm test
      - name: Vendored parts match the manifest
        run: node scripts/vendor-sync.mjs check
      - name: Guard
        run: node scripts/vendor-guard.mjs
      - name: Notices are current
        run: node scripts/vendor-sync.mjs notices --check
      - name: Generated files are current
        run: node scripts/gen.mjs --check
      - name: No unreviewed media or vendored extras in history
        run: node scripts/check-history.mjs
      - name: Release inputs
        run: node scripts/release.mjs check
      - name: Package and verify the release ZIP
        run: node scripts/release.mjs pack
