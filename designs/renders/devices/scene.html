<script type="module">

scene.environment = studioEnvironment();

const UNIT = 477 / 12.7;
const fw = MW / UNIT, fh = MH / UNIT, floorY = -0.6;
const cam = new THREE.OrthographicCamera(-fw / 2, fw / 2, floorY + fh, floorY, 1, 500);

function clamp01(x) { return Math.min(1, Math.max(0, x)); }

function rr(ctx, x, y, w, h, r) {

  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();

function pillPath(ctx, w, h, pw, ph) { rr(ctx, (w - pw) / 2, (h - ph) / 2, pw, ph, ph / 2); }
function capsuleScreen(ctx, w, h, t) {
  const g = ctx.createLinearGradient(0, 0, w, h);

  inf.addColorStop(1, '#2b55cf');
  ctx.fillStyle = inf; ctx.fillRect(0, 0, w, h);
  ctx.shadowColor = 'rgba(4,12,70,0.85)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 22;
  ctx.strokeStyle = 'rgba(4,12,70,0.9)'; ctx.lineWidth = 30;
  pillPath(ctx, w, h, iw + 30, ih + 30); ctx.stroke();
  ctx.restore();
  const is = ctx.createLinearGradient(0, (h - ih) / 2, 0, (h + ih) / 2);
  is.addColorStop(0, 'rgba(90,120,225,0.5)');
  is.addColorStop(1, 'rgba(215,228,255,0.85)');
  ctx.strokeStyle = is; ctx.lineWidth = 3; pillPath(ctx, w, h, iw, ih); ctx.stroke();

  ctx.save();
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 20 + 25 * pulse;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(dotX, h / 2, 11 + 2 * pulse, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function waveScreen(ctx, w, h, t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  ctx.save();
  const r = 26;
  ctx.beginPath(); ctx.moveTo(0, h); ctx.lineTo(0, r); ctx.arcTo(0, 0, r, 0, r); ctx.lineTo(w - r, 0); ctx.arcTo(w, 0, w, r, r); ctx.lineTo(w, h); ctx.closePath(); ctx.clip();
  const bg = ctx.createLinearGradient(0, 0, w * 0.7, h);
  bg.addColorStop(0, '#f7e4a0');
  bg.addColorStop(0.3, '#cfe0e6');
  bg.addColorStop(1, '#4b97ea');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
  const colors = [['#a9d6fa', '#5aa6f2'], ['#4f9df3', '#1f66da'], ['#2a72e2', '#0f46b4'], ['#6db6f7', '#2a7ae4'], ['#1c58cf', '#0b3496'], ['#3f8cee', '#1650c4'], ['#123fa8', '#082a7c']];
  colors.forEach(([top, bottom], i) => {
    const base = 0.3 + i * 0.125;
    const curve = (u) => h * (base + 0.22 - 0.5 * u + 0.075 * Math.sin(u * 3.6 + i * 1.15 + t * 0.55) + 0.028 * Math.sin(u * 8.5 - t * 0.38 + i * 2.1));
    ctx.beginPath();
    ctx.moveTo(0, h + 80);
    for (let x = -20; x <= w + 20; x += 6) ctx.lineTo(x, curve(x / w));
    ctx.lineTo(w + 20, h + 80);
    ctx.closePath();
    const fill = ctx.createLinearGradient(0, h * (base - 0.3), 0, h * (base + 0.45));
    fill.addColorStop(0, top);
    fill.addColorStop(1, bottom);
    ctx.save();
    ctx.shadowColor = 'rgba(5,25,100,0.55)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = -14;
    ctx.fillStyle = fill; ctx.fill();
    ctx.restore();
    ctx.beginPath();
    for (let x = -20; x <= w + 20; x += 6) { const y = curve(x / w) + 2; if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2.5; ctx.stroke();
  });

}


function load(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
const scratch = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const dispC = scratch(2104, 1184), lapC = scratch(1535, 995);
const DISP = { s: 1.187, x: 994, y: 168, sx: 27, sy: 27, sw: 1052, sh: 592 };
const LAP = { s: 0.527, x: 191, y: 514, sx: 232, sy: 152, sw: 1535, sh: 995 };
function floorShadow(cx, y, w, h, a) {
  ctx.save();
  ctx.translate(cx, y); ctx.scale(w / 2, h / 2);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);

  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
let macbook, display;
const DURATION = 8;
window.renderAt = (t) => {

  waveScreen(lapC.getContext('2d'), lapC.width, lapC.height, t);
  renderer.render(scene, cam);

  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, out.width, out.height);
  ctx.setTransform(SS * z, 0, 0, SS * z, SS * (1 - z) * 1240, SS * (1 - z) * 760);

  floorShadow(1647, 1174, 520, 20, 0.16);
  ctx.drawImage(lapC, LAP.x + LAP.sx * LAP.s, LAP.y + LAP.sy * LAP.s, LAP.sw * LAP.s, LAP.sh * LAP.s);

  ctx.drawImage(display, DISP.x, DISP.y, 1106 * DISP.s, 868 * DISP.s);

window.sceneDuration = DURATION;
Promise.all([load('./assets/macbook.png'), load('./assets/display.png'), document.fonts.ready]).then(([a, b]) => { macbook = a; display = b; window.renderAt(4); window.sceneReady = true; });
