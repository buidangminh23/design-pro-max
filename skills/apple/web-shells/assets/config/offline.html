<!doctype html>
<!-- web-shells offline page (design-pro-max): the only page a remote shell bundles; it shows when the origin cannot be reached. Replace https://app.example.com/ with the origin the shell loads. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Offline</title>
<style>
body { font: 1rem/1.5 system-ui, sans-serif; margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1rem; text-align: center; }
a { display: inline-block; padding: 0.75rem 1.25rem; border-radius: 0.5rem; border: 1px solid currentColor; color: inherit; }
</style>
</head>
<body>
<main>
<h1>No connection</h1>
<p>The app opens again when the device is back online.</p>
<a href="https://app.example.com/">Try again</a>
</main>
</body>
</html>
