<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Badge</title>
  <style>
    html, body { margin: 0; background: transparent; }
    .badge { width: 320px; height: 320px; display: grid; place-items: center; }
    .ring { width: 240px; height: 240px; border-radius: 50%; border: 12px solid #0a6e66; animation: pulse 3s ease-in-out infinite; }
    .label { position: absolute; font: 600 32px/40px system-ui, sans-serif; color: #fff; }
    @keyframes pulse {
      0%, 100% { transform: scale(0.92); opacity: 0.6; }
      50% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="badge"><div class="ring"></div><span class="label">New</span></div>
</body>
</html>
